<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upload &mdash; {{ config.title }}</title>
  <style>
    body { font-family: sans-serif; font-size: {{ config.font_size }}; color: #000; background: #fff; margin: 0; padding: 1em 0.5%; }
    h1 { font-size: 1.05em; }
    form { margin-top: 1em; }
  </style>
</head>
<body>
  <h1>{{ config.title }}</h1>
  <form method="post" enctype="multipart/form-data">
    <input type="file" name="image" accept="image/*">
    <button type="submit">Upload</button>
    <button type="submit" name="clear" value="1">Clear</button>
  </form>
</body>
</html>
