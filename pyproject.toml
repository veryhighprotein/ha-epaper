[project]
name = "ha-epaper"
version = "0.1.0"
description = "simple static homeassistant dash"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "jinja2>=3.1.6",
]

[project.scripts]
ha-epaper = "ha_epaper.app:main"

[dependency-groups]
dev = ["ruff", "ty"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
